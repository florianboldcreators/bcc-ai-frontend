<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCC AI - excite-people</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --border: #333;
            --text: #e5e5e5;
            --text-muted: #888;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --error: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.25rem; font-weight: 600; }
        .logo span { color: var(--primary); }
        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .user-name { font-size: 0.875rem; color: var(--text-muted); }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.375rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .logout-btn:hover { border-color: var(--text-muted); }
        
        .main { flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; width: 100%; padding: 1.5rem; }
        
        .login-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }
        .login-title { font-size: 2rem; font-weight: 600; }
        .login-subtitle { color: var(--text-muted); }
        #g_id_signin { margin-top: 1rem; }
        
        .chat-container { flex: 1; display: flex; flex-direction: column; }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            padding: 1rem;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
        }
        .message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: var(--surface);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.assistant pre {
            background: var(--bg);
            padding: 0.75rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .message.assistant code {
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.875rem;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }
        
        .input-area {
            padding: 1rem 0;
            border-top: 1px solid var(--border);
        }
        .input-wrapper {
            display: flex;
            gap: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem;
        }
        .input-wrapper:focus-within { border-color: var(--primary); }
        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 200px;
        }
        #message-input::placeholder { color: var(--text-muted); }
        #send-btn {
            background: var(--primary);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #send-btn:hover { background: var(--primary-hover); }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .status { font-size: 0.75rem; color: var(--text-muted); padding: 0.5rem 0; text-align: center; }
        .status.connected { color: var(--success); }
        .status.error { color: var(--error); }
        
        .hidden { display: none !important; }
        
        @media (max-width: 640px) {
            .header { padding: 0.75rem 1rem; }
            .main { padding: 1rem; }
            .message { max-width: 95%; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">BCC <span>AI</span></div>
        <div class="user-info hidden" id="user-info">
            <img class="user-avatar" id="user-avatar" src="" alt="">
            <span class="user-name" id="user-name"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>
    
    <main class="main">
        <div class="login-container" id="login-container">
            <h1 class="login-title">BCC AI</h1>
            <p class="login-subtitle">Sign in to continue</p>
            <div id="g_id_signin"></div>
        </div>
        
        <div class="chat-container hidden" id="chat-container">
            <div class="messages" id="messages"></div>
            <div class="status" id="status">Ready</div>
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
                    <button id="send-btn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'https://api.excite-people.com';
        let authToken = localStorage.getItem('bcc_token');
        let userData = JSON.parse(localStorage.getItem('bcc_user') || 'null');
        
        // Initialize Google Sign-In
        window.onload = function() {
            google.accounts.id.initialize({
                client_id: '1098330419891-4fnpiv2pj2qv37bnf94rrjo16vj5k2ab.apps.googleusercontent.com',
                callback: handleCredentialResponse,
                auto_select: true
            });
            
            if (authToken && userData) {
                showChat();
            } else {
                google.accounts.id.renderButton(
                    document.getElementById('g_id_signin'),
                    { theme: 'filled_black', size: 'large', shape: 'pill' }
                );
            }
        };
        
        async function handleCredentialResponse(response) {
            try {
                const res = await fetch(`${API_URL}/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                
                if (!res.ok) throw new Error('Auth failed');
                
                const data = await res.json();
                authToken = data.token;
                userData = data.user;
                localStorage.setItem('bcc_token', authToken);
                localStorage.setItem('bcc_user', JSON.stringify(userData));
                showChat();
            } catch (err) {
                showError('Authentication failed. Please try again.');
            }
        }
        
        function showChat() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('chat-container').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-avatar').src = userData.picture || '';
            document.getElementById('user-name').textContent = userData.name || userData.email;
        }
        
        function logout() {
            localStorage.removeItem('bcc_token');
            localStorage.removeItem('bcc_user');
            authToken = null;
            userData = null;
            location.reload();
        }
        
        function addMessage(content, role) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            if (role === 'assistant') {
                div.innerHTML = formatMarkdown(content);
            } else {
                div.textContent = content;
            }
            
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }
        
        function formatMarkdown(text) {
            // Basic markdown: code blocks, inline code, bold, italic
            return text
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }
        
        function showError(msg) {
            addMessage(msg, 'error');
        }
        
        function setStatus(text, type = '') {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = `status ${type}`;
        }
        
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const btn = document.getElementById('send-btn');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            btn.disabled = true;
            setStatus('Thinking...');
            
            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ message })
                });
                
                if (response.status === 401) {
                    logout();
                    return;
                }
                
                if (!response.ok) throw new Error('Request failed');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantDiv = addMessage('', 'assistant');
                let fullContent = '';
                
                setStatus('Streaming...', 'connected');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            if (data === '[KEEPALIVE]') continue;
                            
                            try {
                                const json = JSON.parse(data);
                                if (json.content) {
                                    fullContent += json.content;
                                    assistantDiv.innerHTML = formatMarkdown(fullContent);
                                }
                                if (json.error) {
                                    showError(json.error);
                                }
                            } catch (e) {
                                // Not JSON, might be raw content
                                fullContent += data;
                                assistantDiv.innerHTML = formatMarkdown(fullContent);
                            }
                        }
                    }
                }
                
                setStatus('Ready', 'connected');
            } catch (err) {
                showError('Failed to get response. Please try again.');
                setStatus('Error', 'error');
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }
        
        // Enter to send
        document.getElementById('message-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Auto-resize textarea
        document.getElementById('message-input').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });
    </script>
</body>
</html>
