<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCC AI - excite-people</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --border: #333;
            --text: #e5e5e5;
            --text-muted: #888;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --error: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 100;
        }
        .logo { font-size: 1.25rem; font-weight: 600; cursor: pointer; }
        .logo span { color: var(--primary); }
        .user-info { display: flex; align-items: center; gap: 0.75rem; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; }
        .user-name { font-size: 0.875rem; color: var(--text-muted); }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.375rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .logout-btn:hover { border-color: var(--text-muted); }
        
        .app-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        /* Chat Panel */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-right: 1px solid var(--border);
        }
        .chat-panel.full-width { border-right: none; }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            padding: 1rem;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: var(--surface);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message pre {
            background: var(--bg);
            padding: 0.75rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .message code {
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.875rem;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }
        
        /* Artifact Card in Chat */
        .artifact-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: border-color 0.2s;
        }
        .artifact-card:hover { border-color: var(--primary); }
        .artifact-icon { font-size: 1.5rem; }
        .artifact-info { flex: 1; }
        .artifact-title { font-weight: 500; font-size: 0.9rem; }
        .artifact-type { font-size: 0.75rem; color: var(--text-muted); }
        .artifact-open { color: var(--primary); font-size: 0.8rem; }
        
        .input-area {
            padding: 1rem;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }
        .input-wrapper {
            display: flex;
            gap: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem;
        }
        .input-wrapper:focus-within { border-color: var(--primary); }
        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 200px;
        }
        #message-input::placeholder { color: var(--text-muted); }
        #send-btn {
            background: var(--primary);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #send-btn:hover { background: var(--primary-hover); }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .status { font-size: 0.75rem; color: var(--text-muted); padding: 0.5rem; text-align: center; }
        .status.connected { color: var(--success); }
        .status.error { color: var(--error); }
        
        /* Artifact Panel */
        .artifact-panel {
            width: 50%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }
        .artifact-panel.hidden { display: none; }
        
        .artifact-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .artifact-header-title {
            flex: 1;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .artifact-actions {
            display: flex;
            gap: 0.5rem;
        }
        .artifact-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.375rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .artifact-btn:hover { border-color: var(--primary); color: var(--primary); }
        .artifact-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .artifact-btn.primary:hover { background: var(--primary-hover); }
        
        .artifact-content {
            flex: 1;
            overflow: auto;
            padding: 1rem;
        }
        
        /* Document Editor */
        .doc-editor {
            width: 100%;
            height: 100%;
            background: var(--bg);
            border: none;
            border-radius: 6px;
            padding: 1rem;
            color: var(--text);
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.875rem;
            resize: none;
            outline: none;
        }
        
        /* Preview */
        .doc-preview {
            background: white;
            color: #1a1a1a;
            padding: 2rem;
            border-radius: 6px;
            min-height: 100%;
            line-height: 1.7;
        }
        .doc-preview h1 { font-size: 1.75rem; margin-bottom: 1rem; }
        .doc-preview h2 { font-size: 1.5rem; margin: 1.5rem 0 0.75rem; }
        .doc-preview h3 { font-size: 1.25rem; margin: 1.25rem 0 0.5rem; }
        .doc-preview p { margin-bottom: 1rem; }
        .doc-preview ul, .doc-preview ol { margin: 1rem 0; padding-left: 1.5rem; }
        .doc-preview li { margin-bottom: 0.5rem; }
        .doc-preview code { background: #f1f1f1; padding: 0.125rem 0.375rem; border-radius: 3px; }
        .doc-preview pre { background: #f1f1f1; padding: 1rem; border-radius: 6px; overflow-x: auto; }
        .doc-preview blockquote { border-left: 3px solid #ddd; padding-left: 1rem; color: #666; margin: 1rem 0; }
        
        /* Tabs */
        .artifact-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }
        .artifact-tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
        }
        .artifact-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .artifact-tab:hover { color: var(--text); }
        
        /* Login */
        .login-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }
        .login-title { font-size: 2rem; font-weight: 600; }
        .login-subtitle { color: var(--text-muted); }
        #g_id_signin { margin-top: 1rem; }
        
        .hidden { display: none !important; }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.875rem;
            z-index: 1000;
            animation: toast-in 0.3s ease;
        }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--error); color: var(--error); }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(-50%) translateY(1rem); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        @media (max-width: 768px) {
            .artifact-panel { width: 100%; max-width: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200; }
            .chat-panel { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="location.reload()">BCC <span>AI</span></div>
        <div class="user-info hidden" id="user-info">
            <img class="user-avatar" id="user-avatar" src="" alt="">
            <span class="user-name" id="user-name"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>
    
    <div class="login-container" id="login-container">
        <h1 class="login-title">BCC AI</h1>
        <p class="login-subtitle">Sign in to continue</p>
        <div id="g_id_signin"></div>
    </div>
    
    <div class="app-container hidden" id="app-container">
        <!-- Chat Panel -->
        <div class="chat-panel full-width" id="chat-panel">
            <div class="messages" id="messages"></div>
            <div class="status" id="status">Ready</div>
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="Ask me to create a document, code, or anything..." rows="1"></textarea>
                    <button id="send-btn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Artifact Panel -->
        <div class="artifact-panel hidden" id="artifact-panel">
            <div class="artifact-header">
                <span class="artifact-header-title" id="artifact-title">Document</span>
                <div class="artifact-actions">
                    <button class="artifact-btn" onclick="copyArtifact()">📋 Copy</button>
                    <button class="artifact-btn" onclick="downloadArtifact()">⬇️ Download</button>
                    <button class="artifact-btn" onclick="sendArtifact()">📤 Send</button>
                    <button class="artifact-btn" onclick="closeArtifact()">✕</button>
                </div>
            </div>
            <div class="artifact-tabs">
                <div class="artifact-tab active" data-tab="preview" onclick="switchTab('preview')">Preview</div>
                <div class="artifact-tab" data-tab="edit" onclick="switchTab('edit')">Edit</div>
                <div class="artifact-tab" data-tab="code" onclick="switchTab('code')">Code</div>
            </div>
            <div class="artifact-content" id="artifact-content">
                <div class="doc-preview" id="preview-view"></div>
                <textarea class="doc-editor hidden" id="edit-view"></textarea>
                <pre class="hidden" id="code-view" style="margin:0;background:var(--bg);color:var(--text);padding:1rem;border-radius:6px;height:100%;overflow:auto;"><code id="code-content"></code></pre>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.excite-people.com';
        let authToken = localStorage.getItem('bcc_token');
        let userData = JSON.parse(localStorage.getItem('bcc_user') || 'null');
        let currentArtifact = null;
        let artifacts = [];
        
        // Initialize Google Sign-In
        function initGoogleSignIn() {
            if (typeof google === 'undefined' || typeof google.accounts === 'undefined') {
                setTimeout(initGoogleSignIn, 100);
                return;
            }
            
            google.accounts.id.initialize({
                client_id: '514721456543-hi1uakb551vtbs0uelbmpldq90p9nses.apps.googleusercontent.com',
                callback: handleCredentialResponse,
                auto_select: true
            });
            
            if (authToken && userData) {
                showApp();
            } else {
                google.accounts.id.renderButton(
                    document.getElementById('g_id_signin'),
                    { theme: 'filled_black', size: 'large', shape: 'pill' }
                );
            }
        }
        
        window.onload = initGoogleSignIn;
        
        async function handleCredentialResponse(response) {
            try {
                const res = await fetch(`${API_URL}/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                
                if (!res.ok) throw new Error('Auth failed');
                
                const data = await res.json();
                authToken = data.token;
                userData = data.user;
                localStorage.setItem('bcc_token', authToken);
                localStorage.setItem('bcc_user', JSON.stringify(userData));
                showApp();
            } catch (err) {
                showToast('Authentication failed', 'error');
            }
        }
        
        function showApp() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-avatar').src = userData.picture || '';
            document.getElementById('user-name').textContent = userData.name || userData.email;
        }
        
        function logout() {
            localStorage.removeItem('bcc_token');
            localStorage.removeItem('bcc_user');
            authToken = null;
            userData = null;
            location.reload();
        }
        
        function showToast(message, type = '') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Artifact handling
        function createArtifact(type, title, content) {
            const id = Date.now().toString();
            const artifact = { id, type, title, content, createdAt: new Date() };
            artifacts.push(artifact);
            return artifact;
        }
        
        function openArtifact(artifact) {
            currentArtifact = artifact;
            document.getElementById('artifact-title').textContent = artifact.title;
            document.getElementById('chat-panel').classList.remove('full-width');
            document.getElementById('artifact-panel').classList.remove('hidden');
            
            // Set content based on type
            const preview = document.getElementById('preview-view');
            const editor = document.getElementById('edit-view');
            const code = document.getElementById('code-content');
            
            editor.value = artifact.content;
            code.textContent = artifact.content;
            preview.innerHTML = renderMarkdown(artifact.content);
            
            switchTab('preview');
        }
        
        function closeArtifact() {
            currentArtifact = null;
            document.getElementById('artifact-panel').classList.add('hidden');
            document.getElementById('chat-panel').classList.add('full-width');
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.artifact-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            document.getElementById('preview-view').classList.toggle('hidden', tab !== 'preview');
            document.getElementById('edit-view').classList.toggle('hidden', tab !== 'edit');
            document.getElementById('code-view').classList.toggle('hidden', tab !== 'code');
            
            if (tab === 'preview' && currentArtifact) {
                const content = document.getElementById('edit-view').value;
                document.getElementById('preview-view').innerHTML = renderMarkdown(content);
                currentArtifact.content = content;
            }
        }
        
        function copyArtifact() {
            const content = document.getElementById('edit-view').value;
            navigator.clipboard.writeText(content);
            showToast('Copied to clipboard', 'success');
        }
        
        function downloadArtifact() {
            if (!currentArtifact) return;
            const content = document.getElementById('edit-view').value;
            const ext = currentArtifact.type === 'code' ? '.txt' : '.md';
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentArtifact.title.replace(/[^a-z0-9]/gi, '_') + ext;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Downloaded', 'success');
        }
        
        async function sendArtifact() {
            if (!currentArtifact) return;
            const content = document.getElementById('edit-view').value;
            
            // Prompt for recipient
            const recipient = prompt('Send to (email or name):');
            if (!recipient) return;
            
            showToast('Sending...', '');
            
            try {
                const res = await fetch(`${API_URL}/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        to: recipient,
                        subject: currentArtifact.title,
                        content: content
                    })
                });
                
                if (res.ok) {
                    showToast('Sent successfully!', 'success');
                } else {
                    throw new Error('Send failed');
                }
            } catch (err) {
                showToast('Failed to send', 'error');
            }
        }
        
        function renderMarkdown(text) {
            return text
                .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/^# (.*$)/gm, '<h1>$1</h1>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/^\- (.*$)/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                .replace(/^\> (.*$)/gm, '<blockquote>$1</blockquote>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/^(?!<[hupbl])/gm, '<p>')
                .replace(/$/gm, '</p>')
                .replace(/<p><\/p>/g, '')
                .replace(/<\/p><p>/g, '</p>\n<p>');
        }
        
        function addMessage(content, role) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            if (role === 'assistant') {
                // Check for artifact markers
                const artifactMatch = content.match(/\[ARTIFACT:(\w+)\]([\s\S]*?)\[\/ARTIFACT\]/);
                if (artifactMatch) {
                    const type = artifactMatch[1];
                    const artifactContent = artifactMatch[2].trim();
                    const title = artifactContent.split('\n')[0].replace(/^#+ /, '') || 'Document';
                    
                    const artifact = createArtifact(type, title, artifactContent);
                    
                    // Show text before artifact
                    const beforeText = content.split('[ARTIFACT:')[0].trim();
                    if (beforeText) {
                        div.innerHTML = renderMarkdown(beforeText);
                    }
                    
                    // Add artifact card
                    const card = document.createElement('div');
                    card.className = 'artifact-card';
                    card.onclick = () => openArtifact(artifact);
                    card.innerHTML = `
                        <span class="artifact-icon">${type === 'code' ? '💻' : '📄'}</span>
                        <div class="artifact-info">
                            <div class="artifact-title">${title}</div>
                            <div class="artifact-type">${type === 'code' ? 'Code' : 'Document'}</div>
                        </div>
                        <span class="artifact-open">Open →</span>
                    `;
                    div.appendChild(card);
                    
                    // Show text after artifact
                    const afterText = content.split('[/ARTIFACT]')[1]?.trim();
                    if (afterText) {
                        const afterDiv = document.createElement('div');
                        afterDiv.innerHTML = renderMarkdown(afterText);
                        div.appendChild(afterDiv);
                    }
                } else {
                    div.innerHTML = renderMarkdown(content);
                }
            } else {
                div.textContent = content;
            }
            
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }
        
        function showError(msg) {
            const div = document.createElement('div');
            div.className = 'message error';
            div.textContent = msg;
            document.getElementById('messages').appendChild(div);
        }
        
        function setStatus(text, type = '') {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = `status ${type}`;
        }
        
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const btn = document.getElementById('send-btn');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';
            btn.disabled = true;
            setStatus('Thinking...');
            
            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ message })
                });
                
                if (response.status === 401) {
                    logout();
                    return;
                }
                
                if (!response.ok) throw new Error('Request failed');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantDiv = null;
                let fullContent = '';
                
                setStatus('Streaming...', 'connected');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            if (data === '[KEEPALIVE]') continue;
                            
                            try {
                                const json = JSON.parse(data);
                                if (json.content) {
                                    fullContent += json.content;
                                    if (!assistantDiv) {
                                        assistantDiv = document.createElement('div');
                                        assistantDiv.className = 'message assistant';
                                        document.getElementById('messages').appendChild(assistantDiv);
                                    }
                                    // Only update text, don't parse artifacts yet
                                    assistantDiv.innerHTML = renderMarkdown(fullContent.replace(/\[ARTIFACT:[\s\S]*$/, '...'));
                                }
                                if (json.error) {
                                    showError(json.error);
                                }
                            } catch (e) {
                                fullContent += data;
                            }
                        }
                    }
                    
                    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
                }
                
                // Final render with artifacts
                if (assistantDiv) {
                    assistantDiv.remove();
                    addMessage(fullContent, 'assistant');
                }
                
                setStatus('Ready', 'connected');
            } catch (err) {
                showError('Failed to get response. Please try again.');
                setStatus('Error', 'error');
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }
        
        // Enter to send
        document.getElementById('message-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Auto-resize textarea
        document.getElementById('edit-view').addEventListener('input', function() {
            if (currentArtifact) currentArtifact.content = this.value;
        });
        
        document.getElementById('message-input').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });
    </script>
</body>
</html>
